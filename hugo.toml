baseURL = 'https://aifoc.us/'
languageCode = 'en-us'
title = 'AI Focus'
description = 'A collection of essays and projects on how AI is changing the medium of the web and web development.'
theme = 'aifocustheme'

[params]
  description = 'A collection of essays and projects on how AI is changing the medium of the web and web development.'
  about = "Hello, I'm [Paul Kinlan](https://paul.kinlan.me/), a Developer Advocate on Chrome and a Web Developer. There's a significant shift in the industry driven by AI, and I'm developing an opinion through a collection of essays and projects on how AI is changing the medium of the web and web development at large."
  defaultAuthor = "paulkinlan"
  images = ['/images/card.jpeg']
  # Bump to re-render every per-essay share card (changes the og:image ?v=
  # hash). See layouts/page.ogcard.html and functions/og/[[path]].js.
  ogCardVersion = '1'
[params.authors]
[params.authors.paulkinlan]
  name = "Paul Kinlan"
  email = "paul@aifoc.us"
  homepage = "https://paul.kinlan.me/"
  twitter = "https://x.com/paul_kinlan"
  linkedin = "https://linkedin.com/in/paulkinlan"
  bluesky = "https://bsky.app/profile/paul.kinlan.me"
[params.authors.andreban]
  name = "Andre Cipriani Bandarra"
  homepage = "https://bandarra.me/"
  twitter = "https://x.com/andreban"
  linkedin = "https://www.linkedin.com/in/andreban/"
  bluesky = "https://bandarra.me/"

[taxonomies]
  author = 'authors'

[permalinks.page]
    posts = '/:slug/'
    tutorials = '/training/:slug/'

[mediaTypes]
  [mediaTypes."text/markdown"]
    suffixes = ['md']
  [mediaTypes."text/plain"]
    suffixes = ['txt']

[outputFormats]
  [outputFormats.markdown]
    name = 'markdown'
    mediaType = 'text/markdown'
    isPlainText = true
    permalinkable = true
    baseName = 'index'
  # 1200x630 share-card page for each essay. Not linked from the site; a Pages
  # Function screenshots it with Browser Run to make the og:image.
  [outputFormats.ogcard]
    name = 'ogcard'
    mediaType = 'text/html'
    isHTML = true
    baseName = 'og-card'
    notAlternative = true
    noUgly = true
  [outputFormats.latest]
    name = 'latest'
    mediaType = 'text/plain'
    isPlainText = true
    baseName = 'latest-post'

[outputs]
  home = ['html', 'rss', 'json', 'latest']
  page = ['html', 'markdown']
  section = ['html', 'rss']
  taxonomy = ['html']
  term = ['html', 'rss']

# Essays and tutorials also get the share-card page (outputFormats.ogcard).
[[cascade]]
  outputs = ['html', 'markdown', 'ogcard']
  [cascade.target]
    kind = 'page'
    path = '{/posts/**,/tutorials/**}'
