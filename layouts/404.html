{{ define "main" }}
<style>
.not-found-wrap { max-width: 820px; margin: 0 auto; padding: 2rem 1rem 3rem; text-align: center; }
.not-found-code { font-family: Georgia, "Times New Roman", serif; font-size: clamp(3rem, 12vw, 5.5rem); line-height: 1; margin: 0; color: var(--accent, #4b3aff); }
.not-found-lede { font-size: 1.05rem; color: var(--muted, #666); margin: .6rem 0 1.4rem; }
.not-found-home { display: inline-block; margin-top: 1rem; padding: .5rem 1.1rem; border: 1px solid currentColor; border-radius: 999px; text-decoration: none; color: inherit; }
.not-found-home:hover { background: var(--accent, #4b3aff); color: #fff; border-color: transparent; }
.game-shell { position: relative; width: 100%; max-width: 760px; margin: 1.4rem auto 0; aspect-ratio: 2 / 1; border-radius: 14px; overflow: hidden; border: 1px solid rgba(127,127,127,.25); box-shadow: 0 10px 30px rgba(0,0,0,.12); background: #0b1020; }
#ai404 { display: block; width: 100%; height: 100%; touch-action: none; }
.game-hud { position: absolute; top: 8px; right: 12px; font: 700 .85rem/1 ui-monospace, monospace; color: #9ad; letter-spacing: .05em; text-shadow: 0 1px 2px #000; }
.game-hud .label { color: #678; font-weight: 400; font-size: .65rem; display:block; text-align:right; }
.game-overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .4rem; color: #eef; background: radial-gradient(circle at 50% 40%, rgba(75,58,255,.25), rgba(11,16,32,.86)); text-align: center; padding: 1rem; }
.game-overlay h2 { margin: 0; font-size: 1.1rem; font-weight: 700; }
.game-overlay p { margin: 0; font-size: .8rem; color: #aab; }
.game-overlay .score { font-size: 1.3rem; color: #fff; font-weight: 800; }
.game-btn { margin-top: .4rem; padding: .5rem 1.2rem; border: 0; border-radius: 999px; background: #4b3aff; color: #fff; font: inherit; cursor: pointer; }
.game-btn:hover { background: #6b5cff; }
.game-hint { font-size: .72rem; color: var(--muted, #888); margin-top: .6rem; }
@media (prefers-color-scheme: dark){ .not-found-lede{color:#9aa0a6;} }
</style>

<section class="not-found-wrap">
  <h1 class="not-found-code">404</h1>
  <p class="not-found-lede">This page wandered off. While you're here, help the little AI dodge the bugs.</p>

  <div class="game-shell" id="shell">
    <canvas id="ai404" aria-label="A small game: an AI character jumping over bugs. Press space, tap, or click to jump."></canvas>
    <div class="game-hud"><span class="label">tokens</span><span id="score">0</span></div>
    <div class="game-overlay" id="overlay">
      <h2 id="ovTitle">Ready?</h2>
      <p id="ovMsg">Jump the bugs. Stay alive. Earn tokens.</p>
      <button class="game-btn" id="startBtn" type="button">▶ Run</button>
    </div>
  </div>
  <p class="game-hint">Press <strong>Space</strong> / <strong>↑</strong> or tap the game to jump.</p>

  <a class="not-found-home" href="/">← Back to AI Focus</a>
</section>

<script>
(function(){
  const canvas = document.getElementById('ai404');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ovTitle');
  const ovMsg = document.getElementById('ovMsg');
  const startBtn = document.getElementById('startBtn');
  const scoreEl = document.getElementById('score');
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W=0,H=0,DPR=1;

  function resize(){
    const r = canvas.getBoundingClientRect();
    DPR = Math.min(window.devicePixelRatio||1, 2);
    canvas.width = Math.max(1, Math.round(r.width*DPR));
    canvas.height = Math.max(1, Math.round(r.height*DPR));
    W = r.width; H = r.height;
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  const ro = new ResizeObserver(resize); ro.observe(canvas); resize();

  // world
  const GROUND = () => H*0.82;
  let player, bugs, speed, score, best=0, running=false, dead=false, spawnIn, t, sky, last=0, inputHeld=false;
  function reset(){
    player = { x: W*0.12, y: 0, w: 30, h: 34, vy: 0, onGround:true, blink:0, step:0 };
    player.y = GROUND()-player.h;
    bugs = []; speed = 4.5; score = 0; spawnIn = 80; t=0; sky=0; dead=false; last=0; inputHeld=false;
  }

  // variable-height jump: tap = short hop, hold = full jump (cut handled in loop)
  function jump(){
    if(!running) return;
    if(player.onGround){ player.vy = -15.5; player.onGround=false; }
  }

  function start(){
    reset(); running=true; overlay.style.display='none'; last=0; requestAnimationFrame(loop);
  }
  function over(){
    dead=true; running=false;
    best = Math.max(best, Math.floor(score));
    ovTitle.textContent = 'Game over';
    ovMsg.innerHTML = 'You banked <span class="score">'+Math.floor(score)+' tokens</span>'+(best? ' · best '+best:'');
    startBtn.textContent = '↻ Again';
    overlay.style.display='flex';
  }

  window.__g={get bugs(){return bugs;},get score(){return score;},set score(v){score=v;},get running(){return running;},spawnObstacles:spawnObstacles,resetBugs:function(){bugs=[];}};

  function spawnBug(x){
    const variants = ['bug','err','glitch'];
    const kind = variants[(Math.random()*variants.length)|0];
    const h = 22 + Math.random()*16;
    bugs.push({ x: (x==null?W+10:x), y: GROUND()-h, w: 20+Math.random()*8, h, kind });
  }
  // flying drone: hovers high enough that a grounded player passes safely under it,
  // but a jumping player collides → a "don't jump" dodge (opposite of the ground bugs).
  function spawnFlyer(){
    const w=36, h=20, gy=GROUND(), alt = 88 + Math.random()*36;
    bugs.push({ x: W+12, y: gy-alt-h, w, h, kind:'drone', fly:true });
  }
  // sometimes spawn a cluster (2-3 bugs close together) so you need one long/well-timed jump
  function spawnObstacles(){
    const diff = Math.min(1, score/320);
    const flyCh = score>120 ? (0.10 + 0.10*diff) : 0;     // drones appear after a warm-up
    const grpCh = 0.18 + 0.22*diff;                       // clusters get more common over time
    const r = Math.random();
    if(r < flyCh){ spawnFlyer(); }
    else if(r < flyCh + grpCh){
      const n = 2 + (Math.random()<0.35?1:0);
      let x = W+10;
      for(let i=0;i<n;i++){ spawnBug(x); x += 44 + Math.random()*24; }
    } else { spawnBug(W+10); }
  }

  function loop(now){
    if(!running) return;
    if(!last) last = now;
    let dt = (now - last)/1000; last = now;
    if(dt>0.05) dt=0.05;            // clamp big gaps (tab refocus) so the world doesn't jump
    const f = dt*60;                // 60fps-normalised step → framerate-independent (no 120Hz speed-up)
    t += f;
    sky = (sky + 0.4*f) % 100000;
    // Mario-style jump: gentle rise while held (big arc), cut short on release (short hop), snappy fall
    const up = player.vy < 0;
    let g;
    if(up && inputHeld) g = 0.85;      // rising + held   → full-height jump
    else if(up) g = 2.8;               // rising + released → truncate (short hop)
    else g = 1.5;                      // falling → faster descent (anti-float)
    player.vy += g*f;
    player.y += player.vy*f;
    const gr = GROUND()-player.h;
    if(player.y >= gr){ player.y=gr; player.vy=0; player.onGround=true; player.step += speed*0.12*f; }
    player.blink += f; if(player.blink>140) player.blink -= 140;
    // difficulty ramp
    speed = 4.5 + Math.min(5.5, score*0.007);
    score += 0.18*f;
    scoreEl.textContent = Math.floor(score);
    // spawn
    spawnIn -= f;
    if(spawnIn<=0){ spawnObstacles(); spawnIn = 52 + Math.random()*86 - Math.min(18, score*0.03); }
    // move + cull + collide
    for(const b of bugs){ b.x -= speed*f; }
    bugs = bugs.filter(b=>b.x+b.w> -10);
    for(const b of bugs){
      if(player.x < b.x+b.w-4 && player.x+player.w-4 > b.x &&
         player.y < b.y+b.h-4 && player.y+player.h-4 > b.y){ over(); break; }
    }
    draw();
    requestAnimationFrame(loop);
  }

  function draw(){
    // sky
    const grd = ctx.createLinearGradient(0,0,0,H);
    grd.addColorStop(0,'#0b1020'); grd.addColorStop(1,'#161a33');
    ctx.fillStyle=grd; ctx.fillRect(0,0,W,H);
    // stars / tokens drifting
    ctx.fillStyle='rgba(180,200,255,0.5)';
    for(let i=0;i<18;i++){
      const sx=((i*53 - sky*0.5)%W+W)%W, sy=(i*37)%(H*0.7);
      ctx.fillRect(sx, sy, 2, 2);
    }
    // ground
    const gy=GROUND();
    ctx.strokeStyle='#3a3f6a'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(0,gy); ctx.lineTo(W,gy); ctx.stroke();
    ctx.fillStyle='rgba(90,100,160,0.25)';
    const off=(t*speed)%24;
    for(let x=-off;x<W;x+=24){ ctx.fillRect(x, gy+3, 12, 2); }

    // bugs
    for(const b of bugs){ drawBug(b); }
    // player
    drawBot(player);
  }

  function drawBot(p){
    const x=p.x, y=p.y, w=p.w, h=p.h;
    // shadow
    ctx.fillStyle='rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(x+w/2, GROUND()+2, w*0.55, 4, 0,0,Math.PI*2); ctx.fill();
    // antenna
    ctx.strokeStyle='#9ad'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(x+w/2, y+2); ctx.lineTo(x+w/2, y-7); ctx.stroke();
    ctx.fillStyle = (Math.floor(t/6)%2)? '#7df9ff':'#4b3aff';
    ctx.beginPath(); ctx.arc(x+w/2, y-9, 3, 0, Math.PI*2); ctx.fill();
    // body
    ctx.fillStyle='#e8ecff';
    roundRect(x, y+4, w, h-4, 7); ctx.fill();
    // face visor
    ctx.fillStyle='#0b1020';
    roundRect(x+5, y+9, w-10, 13, 4); ctx.fill();
    // eye (blinks)
    const blinking = p.blink>132;
    ctx.fillStyle = blinking? '#3a3f6a' : '#7df9ff';
    if(!blinking){
      ctx.beginPath(); ctx.arc(x+w/2, y+15, 3.4, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle='#fff'; ctx.fillRect(x+w/2-1, y+13, 1.5, 1.5);
    } else {
      ctx.fillRect(x+w/2-3, y+15, 6, 1.5);
    }
    // legs (running)
    ctx.fillStyle='#9aa3d6';
    const s = p.onGround? Math.sin(p.step)*3 : 0;
    ctx.fillRect(x+6, y+h-3, 6, 4+s);
    ctx.fillRect(x+w-12, y+h-3, 6, 4-s);
  }

  function drawDrone(b){
    const x=b.x,y=b.y,w=b.w,h=b.h, gy=GROUND();
    // ground shadow (it's airborne)
    ctx.fillStyle='rgba(0,0,0,0.18)';
    ctx.beginPath(); ctx.ellipse(x+w/2, gy+2, w*0.4, 3, 0,0, Math.PI*2); ctx.fill();
    // rotor blur (spinning)
    ctx.strokeStyle='rgba(150,180,220,0.75)'; ctx.lineWidth=2;
    const sp = Math.sin(t*0.9)*7;
    ctx.beginPath();
    ctx.moveTo(x+w*0.22,y+1); ctx.lineTo(x+w*0.22+sp,y-6);
    ctx.moveTo(x+w*0.78,y+1); ctx.lineTo(x+w*0.78-sp,y-6);
    ctx.stroke();
    // arms
    ctx.strokeStyle='#6f7bb0';
    ctx.beginPath(); ctx.moveTo(x+w*0.22,y+2); ctx.lineTo(x+w*0.38,y+h*0.5);
    ctx.moveTo(x+w*0.78,y+2); ctx.lineTo(x+w*0.62,y+h*0.5); ctx.stroke();
    // body
    ctx.fillStyle='#a9bdf0'; roundRect(x+w*0.22, y+h*0.25, w*0.56, h*0.7, 5); ctx.fill();
    // scanning eye (blinks red)
    ctx.fillStyle = (Math.floor(t/6)%2) ? '#ff5d73' : '#5a0018';
    ctx.beginPath(); ctx.arc(x+w/2, y+h*0.6, 2.6, 0, Math.PI*2); ctx.fill();
  }

  function drawBug(b){
    if(b.kind==='drone'){ drawDrone(b); return; }
    const x=b.x,y=b.y,w=b.w,h=b.h;
    ctx.fillStyle='rgba(0,0,0,0.25)';
    ctx.beginPath(); ctx.ellipse(x+w/2, GROUND()+2, w*0.45,3,0,0,Math.PI*2); ctx.fill();
    // body
    const col = b.kind==='err' ? '#ff5d73' : b.kind==='glitch' ? '#ffb13d' : '#b15dff';
    ctx.fillStyle=col; roundRect(x,y,w,h,5); ctx.fill();
    // eyes
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(x+w*0.32,y+h*0.4,2.4,0,Math.PI*2); ctx.arc(x+w*0.68,y+h*0.4,2.4,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#0b1020';
    ctx.beginPath(); ctx.arc(x+w*0.34,y+h*0.4,1.1,0,Math.PI*2); ctx.arc(x+w*0.70,y+h*0.4,1.1,0,Math.PI*2); ctx.fill();
    // legs wiggle
    ctx.strokeStyle=col; ctx.lineWidth=2;
    const w2=Math.sin(t*0.5)*2;
    ctx.beginPath();
    ctx.moveTo(x+3,y+h-1); ctx.lineTo(x+1,y+h+3+w2);
    ctx.moveTo(x+w-3,y+h-1); ctx.lineTo(x+w-1,y+h+3-w2);
    ctx.stroke();
  }

  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  // ---- WebMCP: let MCP-capable agents play the game (spec: webmachinelearning.github.io/webmcp/) ----
  const mc = (typeof document!=="undefined" && document.modelContext) || (typeof navigator!=="undefined" && navigator.modelContext);
  if (mc && mc.registerTool) {
    const T = (text) => ({ content: [{ type: "text", text }] });
    const stateJson = () => JSON.stringify({
      running: running, gameOver: dead,
      score: Math.floor(score), best: best, speed: Number(speed.toFixed(2)),
      onGround: !!player.onGround, bugCount: bugs.length,
      distanceToNextBug: bugs.length ? Math.round(Math.min.apply(null, bugs.map(function(b){return b.x-(player.x+player.w);}))) : null
    });
    try {
      mc.registerTool({
        name: "game_state",
        description: "Read the live state of the aifoc.us 404 AI-runner game: tokens (score), best, speed, whether the robot is currently on the ground, number of bugs on screen, and the pixel distance to the nearest bug ahead. Use this to decide when to jump.",
        inputSchema: { type: "object", properties: {} },
        annotations: { readOnlyHint: true },
        async execute() { return T(stateJson()); }
      });
      mc.registerTool({
        name: "game_jump",
        description: "Make the 404 game's little robot jump once. Returns the state immediately after. The game must be running; if it isn't, call game_restart first. Typical play loop: poll game_state, and when distanceToNextBug is small (roughly < 60) and onGround is true, call game_jump, then poll again.",
        inputSchema: { type: "object", properties: {} },
        async execute() { const was = player.onGround; if (running) jump(); return T(stateJson() + ' (jumped; wasOnGround:' + was + ')'); }
      });
      mc.registerTool({
        name: "game_restart",
        description: "Start or restart the aifoc.us 404 game from zero. Returns the initial state. Use this before playing, and again after gameOver becomes true.",
        inputSchema: { type: "object", properties: {} },
        async execute() { start(); return T(stateJson()); }
      });
    } catch (e) { console.warn("WebMCP game tool registration failed:", e); }
  }

  // input
  startBtn.addEventListener('click', function(){ start(); if(document.activeElement && document.activeElement.blur) document.activeElement.blur(); });
  // press = jump (and start holding). Capture the pointer so the hold survives the finger/mouse
  // moving off the canvas; only pointerup/cancel end the hold (not pointerleave, which fired
  // spuriously and was cutting full jumps short in real browsers).
  canvas.addEventListener('pointerdown', function(e){ e.preventDefault(); try{canvas.setPointerCapture(e.pointerId);}catch(_){} inputHeld=true; if(running) jump(); else if(dead) start(); });
  ['pointerup','pointercancel'].forEach(function(ev){ canvas.addEventListener(ev, function(){ inputHeld=false; }); });
  window.addEventListener('keydown', function(e){
    if(e.code==='Space'||e.code==='ArrowUp'){
      e.preventDefault();
      if(e.repeat) return;            // one jump per press (no held-key auto-repeat)
      inputHeld=true;
      if(running) jump(); else start();
    }
  });
  window.addEventListener('keyup', function(e){ if(e.code==='Space'||e.code==='ArrowUp') inputHeld=false; });
  window.addEventListener('blur', function(){ inputHeld=false; });

  // idle splash so it's not empty before start
  reset(); draw();
  if(reduce){ ovMsg.textContent='Tap Run, then jump with Space / ↑.'; }
})();
</script>
{{ end }}
