<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrD" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#cbd5e1"/>
    </marker>
    <marker id="arrU" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrG" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="720" height="420" fill="#fafafa" rx="8"/>

  <text x="360" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Cairn Gateway · Architecture</text>

  <!-- ===== LAYER 1: OWNER ===== -->
  <rect x="200" y="50" width="320" height="34" rx="7" fill="white" stroke="#cbd5e1" stroke-width="1"/>
  <text x="360" y="72" text-anchor="middle" font-size="10" font-weight="700" fill="#64748b">Owner Keypair + Passkey + Recovery Kit</text>

  <!-- Lines down to devices -->
  <line x1="280" y1="85" x2="140" y2="108" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="3,2" marker-end="url(#arrD)"/>
  <line x1="360" y1="85" x2="360" y2="108" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="3,2" marker-end="url(#arrD)"/>
  <line x1="440" y1="85" x2="580" y2="108" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="3,2" marker-end="url(#arrD)"/>

  <!-- ===== LAYER 2: DEVICES ===== -->
  <rect x="50" y="110" width="180" height="38" rx="7" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <text x="140" y="127" text-anchor="middle" font-size="10" font-weight="700" fill="#334155">Laptop</text>
  <text x="140" y="141" text-anchor="middle" font-size="8.5" fill="#94a3b8">Device Key A</text>

  <rect x="270" y="110" width="180" height="38" rx="7" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <text x="360" y="127" text-anchor="middle" font-size="10" font-weight="700" fill="#334155">Home Server</text>
  <text x="360" y="141" text-anchor="middle" font-size="8.5" fill="#94a3b8">Device Key B</text>

  <rect x="490" y="110" width="180" height="38" rx="7" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <text x="580" y="127" text-anchor="middle" font-size="10" font-weight="700" fill="#334155">Phone / tmux</text>
  <text x="580" y="141" text-anchor="middle" font-size="8.5" fill="#94a3b8">Device Key C</text>

  <!-- Agent pills per device -->
  <rect x="65" y="158" width="65" height="18" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.6"/>
  <text x="97" y="171" text-anchor="middle" font-size="8" fill="#94a3b8">Agent 1</text>
  <rect x="138" y="158" width="65" height="18" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.6"/>
  <text x="170" y="171" text-anchor="middle" font-size="8" fill="#94a3b8">Agent 2</text>
  <rect x="285" y="158" width="65" height="18" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.6"/>
  <text x="317" y="171" text-anchor="middle" font-size="8" fill="#94a3b8">Agent 3</text>
  <rect x="505" y="158" width="65" height="18" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.6"/>
  <text x="537" y="171" text-anchor="middle" font-size="8" fill="#94a3b8">Agent 4</text>

  <!-- Agent → Gateway lines -->
  <line x1="140" y1="178" x2="220" y2="208" stroke="#2563eb" stroke-width="0.9" stroke-dasharray="3,2" marker-end="url(#arrU)"/>
  <line x1="360" y1="178" x2="360" y2="208" stroke="#2563eb" stroke-width="0.9" stroke-dasharray="3,2" marker-end="url(#arrU)"/>
  <line x1="540" y1="178" x2="470" y2="208" stroke="#2563eb" stroke-width="0.9" stroke-dasharray="3,2" marker-end="url(#arrU)"/>

  <!-- ===== LAYER 3: GATEWAY ===== -->
  <rect x="110" y="210" width="500" height="86" rx="10" fill="white" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="360" y="234" text-anchor="middle" font-size="12" font-weight="700" fill="#7c3aed">Cairn Gateway</text>
  <text x="360" y="250" text-anchor="middle" font-size="8.5" fill="#94a3b8">Deno Deploy · Deno KV · MCP 2026-07-28</text>

  <!-- Three internal columns -->
  <rect x="130" y="260" width="140" height="28" rx="5" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="0.8"/>
  <text x="200" y="278" text-anchor="middle" font-size="9" font-weight="700" fill="#5b21b6">Policy Engine</text>

  <rect x="290" y="260" width="140" height="28" rx="5" fill="#eff6ff" stroke="#93c5fd" stroke-width="0.8"/>
  <text x="360" y="278" text-anchor="middle" font-size="9" font-weight="700" fill="#1e40af">Operation Proxy</text>

  <rect x="450" y="260" width="140" height="28" rx="5" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8"/>
  <text x="520" y="278" text-anchor="middle" font-size="9" font-weight="700" fill="#166534">Audit Receipts</text>

  <!-- Gateway → Providers lines -->
  <line x1="200" y1="298" x2="120" y2="330" stroke="#16a34a" stroke-width="0.9" stroke-dasharray="3,2" marker-end="url(#arrG)"/>
  <line x1="360" y1="298" x2="360" y2="330" stroke="#16a34a" stroke-width="0.9" stroke-dasharray="3,2" marker-end="url(#arrG)"/>
  <line x1="520" y1="298" x2="600" y2="330" stroke="#16a34a" stroke-width="0.9" stroke-dasharray="3,2" marker-end="url(#arrG)"/>

  <!-- ===== LAYER 4: PROVIDERS ===== -->
  <rect x="40" y="332" width="160" height="36" rx="7" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <text x="120" y="354" text-anchor="middle" font-size="10" font-weight="700" fill="#334155">🐙 GitHub</text>

  <rect x="280" y="332" width="160" height="36" rx="7" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <text x="360" y="354" text-anchor="middle" font-size="10" font-weight="700" fill="#334155">📧 Google</text>

  <rect x="520" y="332" width="160" height="36" rx="7" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <text x="600" y="354" text-anchor="middle" font-size="10" font-weight="700" fill="#334155">🐦 X</text>

  <!-- Footer -->
  <rect x="80" y="385" width="560" height="22" rx="5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.6"/>
  <text x="360" y="400" text-anchor="middle" font-size="8.5" fill="#64748b">agents never see credentials · per-request grant enforcement · independently revocable keys · metadata-only audit</text>
</svg>
