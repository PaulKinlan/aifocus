<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.1"/>
    </filter>
    <filter id="shadowLg" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="slateGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:0.5 } }
    @keyframes flowRight { 0% { opacity:0; transform:translate(0,0) } 15% { opacity:1 } 80% { opacity:1; transform:translate(35px,0) } 100% { opacity:0; transform:translate(35px,0) } }
    @keyframes flowLeft { 0% { opacity:0; transform:translate(0,0) } 15% { opacity:1 } 80% { opacity:1; transform:translate(-35px,0) } 100% { opacity:0; transform:translate(-35px,0) } }
    @keyframes flowUp { 0% { opacity:0; transform:translate(0,0) } 15% { opacity:1 } 80% { opacity:1; transform:translate(0,-30px) } 100% { opacity:0; transform:translate(0,-30px) } }
    @keyframes highlightBorder { 0%,100% { stroke:#cbd5e1 } 40%,60% { stroke:#7c3aed } }

    .layer-gateway { animation: highlightBorder 4s ease-in-out infinite }
    .dot-right { animation: flowRight 2.5s ease-in-out infinite }
    .dot-left { animation: flowLeft 2.5s ease-in-out infinite 0.8s }
    .dot-up { animation: flowUp 2.5s ease-in-out infinite 0.4s }
    .pulse-label { animation: pulse 2s ease-in-out infinite }
  </style>

  <rect width="800" height="520" fill="#fafafa" rx="8"/>

  <!-- Title -->
  <text x="400" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Cairn Gateway · Architecture</text>
  <text x="400" y="44" text-anchor="middle" font-size="10" fill="#94a3b8">shared authoritative OAuth/token gateway for agents</text>

  <!-- ============================================ -->
  <!-- LAYER 0: IDENTITY ROOT -->
  <!-- ============================================ -->
  <g>
    <rect x="280" y="62" width="240" height="42" rx="8" fill="white" stroke="#cbd5e1" stroke-width="1" filter="url(#shadow)"/>
    <text x="400" y="80" text-anchor="middle" font-size="9" font-weight="700" fill="#64748b">🔐 IDENTITY ROOT</text>
    <text x="400" y="95" text-anchor="middle" font-size="8.5" fill="#94a3b8">Owner Keypair · Passkey · Recovery Kit</text>
  </g>

  <!-- ============================================ -->
  <!-- LAYER 1: DEVICES -->
  <!-- ============================================ -->
  <g>
    <rect x="40" y="125" width="190" height="40" rx="8" fill="white" stroke="#cbd5e1" stroke-width="1" filter="url(#shadow)"/>
    <text x="135" y="143" text-anchor="middle" font-size="9" font-weight="700" fill="#334155">💻 Laptop</text>
    <text x="135" y="157" text-anchor="middle" font-size="8" fill="#94a3b8">Device Key A</text>

    <rect x="305" y="125" width="190" height="40" rx="8" fill="white" stroke="#cbd5e1" stroke-width="1" filter="url(#shadow)"/>
    <text x="400" y="143" text-anchor="middle" font-size="9" font-weight="700" fill="#334155">🖥️ Home Server</text>
    <text x="400" y="157" text-anchor="middle" font-size="8" fill="#94a3b8">Device Key B</text>

    <rect x="570" y="125" width="190" height="40" rx="8" fill="white" stroke="#cbd5e1" stroke-width="1" filter="url(#shadow)"/>
    <text x="665" y="143" text-anchor="middle" font-size="9" font-weight="700" fill="#334155">📱 Phone / tmux</text>
    <text x="665" y="157" text-anchor="middle" font-size="8" fill="#94a3b8">Device Key C</text>
  </g>

  <!-- Arrows: Identity → Devices -->
  <line x1="350" y1="105" x2="135" y2="121" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="400" y1="105" x2="400" y2="121" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="450" y1="105" x2="665" y2="121" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="220" y="117" font-size="7.5" fill="#94a3b8">enrolls</text>
  <text x="510" y="117" font-size="7.5" fill="#94a3b8">enrolls</text>

  <!-- ============================================ -->
  <!-- LAYER 2: AGENTS (per device) -->
  <!-- ============================================ -->
  <g>
    <rect x="55" y="185" width="75" height="28" rx="5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8"/>
    <text x="92" y="202" text-anchor="middle" font-size="8" fill="#64748b">Agent 1</text>
    <rect x="140" y="185" width="75" height="28" rx="5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8"/>
    <text x="177" y="202" text-anchor="middle" font-size="8" fill="#64748b">Agent 2</text>

    <rect x="320" y="185" width="75" height="28" rx="5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8"/>
    <text x="357" y="202" text-anchor="middle" font-size="8" fill="#64748b">Agent 3</text>
    <rect x="405" y="185" width="75" height="28" rx="5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8"/>
    <text x="442" y="202" text-anchor="middle" font-size="8" fill="#64748b">Agent 4</text>

    <rect x="585" y="185" width="75" height="28" rx="5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8"/>
    <text x="622" y="202" text-anchor="middle" font-size="8" fill="#64748b">Agent 5</text>
    <rect x="670" y="185" width="75" height="28" rx="5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8"/>
    <text x="707" y="202" text-anchor="middle" font-size="8" fill="#64748b">Agent 6</text>
  </g>

  <!-- ============================================ -->
  <!-- CENTRAL: THE GATEWAY -->
  <!-- ============================================ -->
  <rect x="180" y="240" width="440" height="170" rx="12" fill="white" stroke="#7c3aed" stroke-width="2" filter="url(#shadowLg)" class="layer-gateway"/>
  <text x="400" y="264" text-anchor="middle" font-size="12" font-weight="700" fill="#7c3aed">🌐 Cairn Gateway</text>
  <text x="400" y="280" text-anchor="middle" font-size="8.5" fill="#94a3b8">Deno Deploy · Deno KV · MCP 2026-07-28</text>

  <!-- Gateway internal components -->
  <g>
    <!-- Policy engine -->
    <rect x="200" y="293" width="125" height="48" rx="6" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1"/>
    <text x="262" y="312" text-anchor="middle" font-size="9" font-weight="700" fill="#5b21b6">📋 Policy Engine</text>
    <text x="262" y="328" text-anchor="middle" font-size="7.5" fill="#7c3aed">grant validation</text>
    <text x="262" y="338" text-anchor="middle" font-size="7.5" fill="#7c3aed">call-time enforcement</text>

    <!-- Operation proxy -->
    <rect x="338" y="293" width="125" height="48" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
    <text x="400" y="312" text-anchor="middle" font-size="9" font-weight="700" fill="#1e40af">🔀 Operation Proxy</text>
    <text x="400" y="328" text-anchor="middle" font-size="7.5" fill="#2563eb">brokered invoke</text>
    <text x="400" y="338" text-anchor="middle" font-size="7.5" fill="#2563eb">short-lived delegation</text>

    <!-- Audit & Receipts -->
    <rect x="475" y="293" width="125" height="48" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
    <text x="537" y="312" text-anchor="middle" font-size="9" font-weight="700" fill="#166534">📊 Audit Receipts</text>
    <text x="537" y="328" text-anchor="middle" font-size="7.5" fill="#16a34a">metadata-only logs</text>
    <text x="537" y="338" text-anchor="middle" font-size="7.5" fill="#16a34a">no tokens in receipts</text>
  </g>

  <!-- Token custody -->
  <rect x="250" y="352" width="300" height="30" rx="6" fill="#fefce8" stroke="#fde047" stroke-width="1"/>
  <text x="400" y="372" text-anchor="middle" font-size="9" font-weight="600" fill="#92400e">🔒 Token Custody Adapter (Nango · self-host · bring-your-own)</text>

  <!-- MCP surface -->
  <rect x="280" y="390" width="240" height="22" rx="5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8"/>
  <text x="400" y="405" text-anchor="middle" font-size="8.5" fill="#64748b">MCP: search_capabilities · describe_operation · invoke_operation</text>

  <!-- Agent → Gateway arrows -->
  <line x1="92" y1="214" x2="220" y2="306" stroke="url(#blueGrad)" stroke-width="1" stroke-dasharray="4,2"/>
  <line x1="357" y1="214" x2="350" y2="304" stroke="url(#blueGrad)" stroke-width="1" stroke-dasharray="4,2"/>
  <line x1="622" y1="214" x2="530" y2="304" stroke="url(#blueGrad)" stroke-width="1" stroke-dasharray="4,2"/>

  <!-- ============================================ -->
  <!-- LAYER 3: PROVIDERS -->
  <!-- ============================================ -->
  <rect x="50" y="450" width="100" height="36" rx="7" fill="white" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)"/>
  <text x="100" y="472" text-anchor="middle" font-size="9" font-weight="700" fill="#334155">🐙 GitHub</text>

  <rect x="175" y="450" width="100" height="36" rx="7" fill="white" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)"/>
  <text x="225" y="472" text-anchor="middle" font-size="9" font-weight="700" fill="#334155">📧 Google</text>

  <rect x="300" y="450" width="100" height="36" rx="7" fill="white" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)"/>
  <text x="350" y="472" text-anchor="middle" font-size="9" font-weight="700" fill="#334155">🐦 X</text>

  <rect x="425" y="450" width="100" height="36" rx="7" fill="white" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)"/>
  <text x="475" y="472" text-anchor="middle" font-size="9" font-weight="700" fill="#334155">📦 Deno</text>

  <rect x="550" y="450" width="100" height="36" rx="7" fill="white" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)"/>
  <text x="600" y="472" text-anchor="middle" font-size="9" font-weight="700" fill="#334155">📊 reMarkable</text>

  <rect x="675" y="450" width="100" height="36" rx="7" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8" stroke-dasharray="3,2"/>
  <text x="725" y="472" text-anchor="middle" font-size="8.5" fill="#94a3b8">+ more…</text>

  <!-- Gateway → Provider arrows -->
  <line x1="300" y1="410" x2="100" y2="446" stroke="url(#greenGrad)" stroke-width="1" stroke-dasharray="4,2"/>
  <line x1="370" y1="410" x2="225" y2="446" stroke="url(#greenGrad)" stroke-width="1" stroke-dasharray="4,2"/>
  <line x1="430" y1="410" x2="350" y2="446" stroke="url(#greenGrad)" stroke-width="1" stroke-dasharray="4,2"/>
  <line x1="480" y1="410" x2="475" y2="446" stroke="url(#greenGrad)" stroke-width="1" stroke-dasharray="4,2"/>
  <line x1="530" y1="410" x2="600" y2="446" stroke="url(#greenGrad)" stroke-width="1" stroke-dasharray="4,2"/>

  <!-- Animation dots on key paths -->
  <circle cx="145" cy="340" r="3.5" fill="url(#blueGrad)" class="dot-right" opacity="0.6"/>
  <circle cx="280" cy="420" r="3.5" fill="url(#greenGrad)" class="dot-right" opacity="0.6" style="animation-delay:0.8s"/>

  <!-- ============================================ -->
  <!-- SECURITY INVARIANTS CALLOUT -->
  <!-- ============================================ -->
  <g transform="translate(30, 418)">
    <rect x="0" y="0" width="745" height="24" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8"/>
    <text x="15" y="16" font-size="8" fill="#dc2626">🛡️</text>
    <text x="32" y="16" font-size="8" fill="#64748b">agent never sees tokens · per-request policy evaluation · independently revocable device keys · metadata-only audit trail</text>
  </g>

  <!-- Capability callout -->
  <g class="pulse-label">
    <rect x="210" y="235" width="380" height="5" rx="2.5" fill="#fbbf24" opacity="0.6"/>
  </g>

  <!-- Footer label -->
  <text x="400" y="510" text-anchor="middle" font-size="9" fill="#94a3b8">Stage 0 accepted (90/90 tests, 84% branch coverage, 3 independent reviews) · Stage 1 accepted · M2 in progress</text>
</svg>
