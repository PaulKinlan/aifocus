<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="720" height="320" fill="#fafafa" rx="8"/>

  <text x="360" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">CDS for Agents · Enrollment Flow</text>

  <!-- Step 1 -->
  <text x="105" y="112" text-anchor="middle" font-size="10" font-weight="700" fill="#94a3b8">① scan badge</text>
  <!-- Step 2 -->
  <text x="290" y="112" text-anchor="middle" font-size="10" font-weight="700" fill="#94a3b8">② share code</text>
  <!-- Step 3 -->
  <text x="535" y="112" text-anchor="middle" font-size="10" font-weight="700" fill="#94a3b8">③ register &amp; verify</text>

  <!-- Human -->
  <rect x="30" y="60" width="150" height="42" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="105" y="78" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">Human Attendee</text>
  <text x="105" y="93" text-anchor="middle" font-size="8.5" fill="#94a3b8">scans badge QR</text>

  <!-- Claim code (bridging element) -->
  <rect x="220" y="66" width="100" height="30" rx="5" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1"/>
  <text x="270" y="85" text-anchor="middle" font-size="9" font-weight="600" fill="#7c3aed">XK9M-4T2P</text>
  <text x="270" y="107" text-anchor="middle" font-size="7" fill="#94a3b8">claim code</text>

  <!-- Agent -->
  <rect x="360" y="60" width="150" height="42" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="435" y="78" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">Your Agent</text>
  <text x="435" y="93" text-anchor="middle" font-size="8.5" fill="#94a3b8">Claude Code / Gemini CLI</text>

  <!-- Gateway -->
  <rect x="550" y="60" width="150" height="42" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="625" y="78" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">CDS Gateway</text>
  <text x="625" y="93" text-anchor="middle" font-size="8.5" fill="#94a3b8">Deno Deploy</text>

  <!-- Arrows between actors -->
  <line x1="182" y1="81" x2="218" y2="81" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="322" y1="81" x2="358" y2="81" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="512" y1="81" x2="548" y2="81" stroke="#2563eb" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Callout: register(claim_code) -->
  <rect x="388" y="108" width="95" height="16" rx="3" fill="#eff6ff"/>
  <text x="435" y="119" text-anchor="middle" font-size="7.5" fill="#2563eb">register(code)</text>

  <!-- What happens inside Gateway -->
  <rect x="190" y="150" width="340" height="55" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <text x="360" y="170" text-anchor="middle" font-size="10" font-weight="700" fill="#334155">Inside the Gateway</text>

  <!-- Three internal steps -->
  <rect x="205" y="180" width="95" height="18" rx="3" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8"/>
  <text x="252" y="193" text-anchor="middle" font-size="8" fill="#166534">validate code</text>

  <text x="308" y="193" font-size="14" fill="#cbd5e1">→</text>

  <rect x="318" y="180" width="95" height="18" rx="3" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="0.8"/>
  <text x="365" y="193" text-anchor="middle" font-size="8" fill="#5b21b6">bind identity</text>

  <text x="421" y="193" font-size="14" fill="#cbd5e1">→</text>

  <rect x="430" y="180" width="85" height="18" rx="3" fill="#fefce8" stroke="#fde047" stroke-width="0.8"/>
  <text x="472" y="193" text-anchor="middle" font-size="8" fill="#92400e">issue session</text>

  <!-- Result -->
  <rect x="250" y="220" width="220" height="36" rx="8" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.2"/>
  <text x="360" y="243" text-anchor="middle" font-size="11" font-weight="700" fill="#5b21b6">✅ Verified Summit Attendee</text>

  <!-- Arrow down from gateway -->
  <line x1="360" y1="206" x2="360" y2="218" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Footer -->
  <text x="360" y="305" text-anchor="middle" font-size="9" fill="#94a3b8">one-time code · atomically consumed · binds agent to human · summit-scoped · no passwords</text>
</svg>
