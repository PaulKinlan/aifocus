<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="640" height="200" fill="#fafafa" rx="8"/>

  <text x="320" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">pi-chaos-relay · Identity Flow</text>

  <!-- Agent -->
  <rect x="40" y="48" width="180" height="110" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="130" y="74" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">Your Machine</text>
  <text x="130" y="92" text-anchor="middle" font-size="9.5" fill="#64748b">pi-chaos-relay agent</text>

  <rect x="60" y="106" width="140" height="18" rx="4" fill="#fffbeb" stroke="#fcd34d" stroke-width="0.8"/>
  <text x="130" y="119" text-anchor="middle" font-size="8.5" fill="#92400e">ECDSA P-256 keypair</text>

  <rect x="60" y="130" width="140" height="18" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="0.8"/>
  <text x="130" y="143" text-anchor="middle" font-size="8.5" fill="#1e40af">signs requests with private key</text>

  <!-- Arrow -->
  <line x1="222" y1="103" x2="368" y2="103" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)" stroke-dasharray="5,3"/>
  <text x="295" y="95" text-anchor="middle" font-size="8.5" fill="#64748b">public key (once)</text>
  <text x="295" y="118" text-anchor="middle" font-size="8.5" fill="#64748b">signed requests</text>

  <!-- Server -->
  <rect x="372" y="48" width="200" height="110" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="472" y="74" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">Relay Server</text>
  <text x="472" y="92" text-anchor="middle" font-size="9.5" fill="#64748b">chaos-relay.com</text>

  <rect x="392" y="106" width="160" height="18" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8"/>
  <text x="472" y="119" text-anchor="middle" font-size="8.5" fill="#166534">stores public key only</text>

  <rect x="392" y="130" width="160" height="18" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8"/>
  <text x="472" y="143" text-anchor="middle" font-size="8.5" fill="#166534">verifies signature → responds</text>

  <!-- Footer -->
  <text x="320" y="185" text-anchor="middle" font-size="9" fill="#94a3b8">no accounts · no passwords · keypair is identity · private key never leaves the machine</text>
</svg>
