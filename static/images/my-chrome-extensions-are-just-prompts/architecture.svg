<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 502" width="880" height="502" role="img" aria-label="Prompt in a Box architecture: a prompt, a manifest and a config are bundled with a generic runtime. The service worker turns triggers into an agent loop that can call Chrome API tools, read and write state, and run code in a sandbox." xmlns:c2pa="http://c2pa.org/manifest">
  <title>Prompt in a Box architecture: a prompt, a manifest and a config are bundled with a generic runtime. The service worker turns triggers into an agent loop that can call Chrome API tools, read and write state, and run code in a sandbox.</title>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .t { font-size: 15px; font-weight: 600; }
    .s { font-size: 12.5px; fill: #4b5563; }
    .h { font-size: 12px; font-weight: 700; letter-spacing: .08em; fill: #6b7280; }
    .n { font-size: 12px; fill: #6b7280; }
    .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .grp { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.5; }
    .hot { fill: #eef2ff; stroke: #6366f1; stroke-width: 1.5; }
    .warm { fill: #fff7ed; stroke: #f59e0b; stroke-width: 1.5; }
    .ln { stroke: #64748b; stroke-width: 1.5; fill: none; }
    .dash { stroke-dasharray: 5 4; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="878" height="500" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
  <rect class="grp" x="24" y="24" width="212" height="300" rx="12"/>
  <text class="h" x="40" y="50">THE BOX (A .ZIP)</text>
  <rect class="hot" x="40" y="64" width="180" height="64" rx="9"/>
  <text class="t" x="130.0" y="92.0" text-anchor="middle">prompt.md</text>
  <text class="s" x="130.0" y="110.0" text-anchor="middle">what it should do</text>
  <rect class="box" x="40" y="142" width="180" height="64" rx="9"/>
  <text class="t" x="130.0" y="170.0" text-anchor="middle">manifest.json</text>
  <text class="s" x="130.0" y="188.0" text-anchor="middle">what it can reach</text>
  <rect class="box" x="40" y="220" width="180" height="64" rx="9"/>
  <text class="t" x="130.0" y="248.0" text-anchor="middle">config.json</text>
  <text class="s" x="130.0" y="266.0" text-anchor="middle">models, schedule, settings</text>
  <text class="n" x="130" y="308" text-anchor="middle">+ the same generic runtime</text>
  <rect class="grp" x="282" y="24" width="336" height="300" rx="12"/>
  <text class="h" x="298" y="50">MV3 SERVICE WORKER</text>
  <rect class="box" x="298" y="64" width="304" height="52" rx="9"/>
  <text class="t" x="450.0" y="86.0" text-anchor="middle">Triggers</text>
  <text class="s" x="450.0" y="104.0" text-anchor="middle">alarm · browser event · click · install</text>
  <rect class="box" x="298" y="138" width="304" height="52" rx="9"/>
  <text class="t" x="450.0" y="160.0" text-anchor="middle">Compose the message</text>
  <text class="s" x="450.0" y="178.0" text-anchor="middle">settings · open tabs · queued events</text>
  <rect class="hot" x="298" y="212" width="304" height="52" rx="9"/>
  <text class="t" x="450.0" y="234.0" text-anchor="middle">agent-do loop</text>
  <text class="s" x="450.0" y="252.0" text-anchor="middle">model call → tool calls → repeat</text>
  <text class="n" x="450" y="290" text-anchor="middle">every step and tool call goes to the audit log</text>
  <path class="ln" d="M450,116 L450,136" marker-end="url(#a)"/>
  <path class="ln" d="M450,190 L450,210" marker-end="url(#a)"/>
  <path class="ln" d="M236,96 L280,96" marker-end="url(#a)"/>
  <rect class="box" x="664" y="64" width="192" height="74" rx="9"/>
  <text class="t" x="760.0" y="88.0" text-anchor="middle">Model provider</text>
  <text class="s" x="760.0" y="106.0" text-anchor="middle">Gemini · Claude · GPT</text>
  <text class="s" x="760.0" y="124.0" text-anchor="middle">your own API key</text>
  <path class="ln" d="M602,228 L760,140" marker-end="url(#a)" marker-start="url(#a)"/>
  <rect class="box" x="664" y="212" width="192" height="112" rx="9"/>
  <text class="t" x="760.0" y="255.0" text-anchor="middle">UI surfaces</text>
  <text class="s" x="760.0" y="273.0" text-anchor="middle">popup · side panel</text>
  <text class="s" x="760.0" y="291.0" text-anchor="middle">options · Studio</text>
  <path class="ln" d="M662,262 L604,246" marker-end="url(#a)" marker-start="url(#a)"/>
  <text class="h" x="24" y="372">WHAT THE LOOP CAN TOUCH</text>
  <rect class="box" x="24" y="386" width="262" height="92" rx="9"/>
  <text class="t" x="155.0" y="419.0" text-anchor="middle">Chrome API tools</text>
  <text class="s" x="155.0" y="437.0" text-anchor="middle">tabs · bookmarks · history · downloads…</text>
  <text class="s" x="155.0" y="455.0" text-anchor="middle">only if the permission is granted</text>
  <rect class="box" x="309" y="386" width="262" height="92" rx="9"/>
  <text class="t" x="440.0" y="419.0" text-anchor="middle">State</text>
  <text class="s" x="440.0" y="437.0" text-anchor="middle">OPFS: artifacts, audit, event queue</text>
  <text class="s" x="440.0" y="455.0" text-anchor="middle">chrome.storage: settings, undo journal</text>
  <rect class="warm" x="594" y="386" width="262" height="92" rx="9"/>
  <text class="t" x="725.0" y="419.0" text-anchor="middle">Offscreen doc + sandbox</text>
  <text class="s" x="725.0" y="437.0" text-anchor="middle">clipboard, DOM parsing</text>
  <text class="s" x="725.0" y="455.0" text-anchor="middle">code_mode runs in here</text>
  <path class="ln" d="M400,326 L250,384" marker-end="url(#a)" marker-start="url(#a)"/>
  <path class="ln" d="M450,326 L450,384" marker-end="url(#a)" marker-start="url(#a)"/>
  <path class="ln" d="M520,326 L720,384" marker-end="url(#a)" marker-start="url(#a)"/>

<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
