<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 424" width="880" height="424" role="img" aria-label="How code_mode works: the model writes a script, the service worker passes it through the offscreen document into a sandboxed iframe, and every tool call inside the script is sent back to the service worker to be checked, run and logged." xmlns:c2pa="http://c2pa.org/manifest">
  <title>How code_mode works: the model writes a script, the service worker passes it through the offscreen document into a sandboxed iframe, and every tool call inside the script is sent back to the service worker to be checked, run and logged.</title>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .t { font-size: 15px; font-weight: 600; }
    .s { font-size: 12.5px; fill: #4b5563; }
    .h { font-size: 12px; font-weight: 700; letter-spacing: .08em; fill: #6b7280; }
    .n { font-size: 12px; fill: #6b7280; }
    .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .grp { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.5; }
    .hot { fill: #eef2ff; stroke: #6366f1; stroke-width: 1.5; }
    .warm { fill: #fff7ed; stroke: #f59e0b; stroke-width: 1.5; }
    .ln { stroke: #64748b; stroke-width: 1.5; fill: none; }
    .dash { stroke-dasharray: 5 4; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="878" height="422" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
  <rect class="box" x="20" y="24" width="180" height="44" rx="9"/>
  <text class="t" x="110.0" y="51.0" text-anchor="middle">Model</text>
  <path class="ln dash" d="M110,68 L110,404"/>
  <rect class="box" x="240" y="24" width="180" height="44" rx="9"/>
  <text class="t" x="330.0" y="51.0" text-anchor="middle">Service worker</text>
  <path class="ln dash" d="M330,68 L330,404"/>
  <rect class="box" x="460" y="24" width="180" height="44" rx="9"/>
  <text class="t" x="550.0" y="51.0" text-anchor="middle">Offscreen document</text>
  <path class="ln dash" d="M550,68 L550,404"/>
  <rect class="warm" x="680" y="24" width="180" height="44" rx="9"/>
  <text class="t" x="770.0" y="51.0" text-anchor="middle">Sandboxed iframe</text>
  <path class="ln dash" d="M770,68 L770,404"/>
  <rect x="690" y="74" width="160" height="18" fill="#ffffff"/>
  <text class="n" x="770" y="86" text-anchor="middle" style="fill:#92400e">no chrome.*, no network</text>
  <rect x="122.0" y="105" width="196" height="18" fill="#ffffff"/>
  <text class="s" x="220.0" y="119" text-anchor="middle">code_mode({ code })</text>
  <path class="ln" d="M112,130 L328,130" marker-end="url(#a)"/>
  <rect x="342.0" y="145" width="196" height="18" fill="#ffffff"/>
  <text class="s" x="440.0" y="159" text-anchor="middle">execute (id + nonce)</text>
  <path class="ln" d="M332,170 L548,170" marker-end="url(#a)"/>
  <rect x="562.0" y="185" width="196" height="18" fill="#ffffff"/>
  <text class="s" x="660.0" y="199" text-anchor="middle">postMessage(code)</text>
  <path class="ln" d="M552,210 L768,210" marker-end="url(#a)"/>
  <rect class="grp" x="282" y="232" width="560" height="96" rx="10"/>
  <text class="h" x="296" y="252">REPEATS FOR EVERY TOOL THE SCRIPT CALLS</text>
  <rect x="420" y="259" width="260" height="18" fill="#f8fafc"/>
  <text class="s" x="550.0" y="273" text-anchor="middle">tools.tab_read({ tabId }) via postMessage</text>
  <path class="ln" d="M768,284 L332,284" marker-end="url(#a)"/>
  <rect x="452" y="289" width="196" height="18" fill="#f8fafc"/>
  <text class="s" x="550.0" y="303" text-anchor="middle">result of the real Chrome call</text>
  <path class="ln dash" d="M332,314 L768,314" marker-end="url(#a)"/>
  <rect x="452.0" y="339" width="196" height="18" fill="#ffffff"/>
  <text class="s" x="550.0" y="353" text-anchor="middle">return value of the script</text>
  <path class="ln dash" d="M768,364 L332,364" marker-end="url(#a)"/>
  <rect x="122.0" y="371" width="196" height="18" fill="#ffffff"/>
  <text class="s" x="220.0" y="385" text-anchor="middle">one compact tool result</text>
  <path class="ln dash" d="M328,396 L112,396" marker-end="url(#a)"/>

<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
