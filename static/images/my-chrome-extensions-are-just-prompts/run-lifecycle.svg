<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 232" width="880" height="232" role="img" aria-label="The lifecycle of one run: wake, load the prompt and tools, compose the message, run the agent loop, record the trace, and sleep. A saved script can handle an event without calling the model at all." xmlns:c2pa="http://c2pa.org/manifest">
  <title>The lifecycle of one run: wake, load the prompt and tools, compose the message, run the agent loop, record the trace, and sleep. A saved script can handle an event without calling the model at all.</title>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .t { font-size: 15px; font-weight: 600; }
    .s { font-size: 12.5px; fill: #4b5563; }
    .h { font-size: 12px; font-weight: 700; letter-spacing: .08em; fill: #6b7280; }
    .n { font-size: 12px; fill: #6b7280; }
    .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .grp { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.5; }
    .hot { fill: #eef2ff; stroke: #6366f1; stroke-width: 1.5; }
    .warm { fill: #fff7ed; stroke: #f59e0b; stroke-width: 1.5; }
    .ln { stroke: #64748b; stroke-width: 1.5; fill: none; }
    .dash { stroke-dasharray: 5 4; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="878" height="230" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
  <rect class="box" x="24" y="60" width="126" height="92" rx="9"/>
  <text class="t" x="87.0" y="93.0" text-anchor="middle">1. Wake</text>
  <text class="s" x="87.0" y="111.0" text-anchor="middle">alarm, event,</text>
  <text class="s" x="87.0" y="129.0" text-anchor="middle">click or install</text>
  <path class="ln" d="M151,106 L164,106" marker-end="url(#a)"/>
  <rect class="box" x="165" y="60" width="126" height="92" rx="9"/>
  <text class="t" x="228.0" y="93.0" text-anchor="middle">2. Load</text>
  <text class="s" x="228.0" y="111.0" text-anchor="middle">prompt.md +</text>
  <text class="s" x="228.0" y="129.0" text-anchor="middle">granted tools</text>
  <path class="ln" d="M292,106 L305,106" marker-end="url(#a)"/>
  <rect class="box" x="306" y="60" width="126" height="92" rx="9"/>
  <text class="t" x="369.0" y="93.0" text-anchor="middle">3. Compose</text>
  <text class="s" x="369.0" y="111.0" text-anchor="middle">local time, settings,</text>
  <text class="s" x="369.0" y="129.0" text-anchor="middle">tabs, queued events</text>
  <path class="ln" d="M433,106 L446,106" marker-end="url(#a)"/>
  <rect class="hot" x="447" y="60" width="126" height="92" rx="9"/>
  <text class="t" x="510.0" y="93.0" text-anchor="middle">4. Loop</text>
  <text class="s" x="510.0" y="111.0" text-anchor="middle">model ⇄ tools,</text>
  <text class="s" x="510.0" y="129.0" text-anchor="middle">up to 12 steps</text>
  <path class="ln" d="M574,106 L587,106" marker-end="url(#a)"/>
  <rect class="box" x="588" y="60" width="126" height="92" rx="9"/>
  <text class="t" x="651.0" y="93.0" text-anchor="middle">5. Record</text>
  <text class="s" x="651.0" y="111.0" text-anchor="middle">audit trace +</text>
  <text class="s" x="651.0" y="129.0" text-anchor="middle">undo journal</text>
  <path class="ln" d="M715,106 L728,106" marker-end="url(#a)"/>
  <rect class="box" x="729" y="60" width="126" height="92" rx="9"/>
  <text class="t" x="792.0" y="93.0" text-anchor="middle">6. Sleep</text>
  <text class="s" x="792.0" y="111.0" text-anchor="middle">Chrome kills</text>
  <text class="s" x="792.0" y="129.0" text-anchor="middle">the worker</text>
  <text class="h" x="24" y="40">ONE RUN</text>
  <path class="ln dash" d="M87,154 L87,196 L792,196 L792,154" marker-end="url(#a)"/>
  <rect x="250" y="183" width="380" height="26" rx="13" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <text class="s" x="440" y="201" text-anchor="middle" style="fill:#92400e">zero-token fast path: a saved script handles the event</text>

<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
