<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 1000 400" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="title">Handing a task to another agent</title>
  <desc id="desc">You ask by voice, the model calls delegate_task, and the daemon starts an agent such as Pi or Claude Code over ACP in the project folder. Progress and the list of changed files come back to the room.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
    <style>
      .h{font-size:16px;font-weight:650;fill:#1f2328}
      .b{font-size:15px;font-weight:600;fill:#1f2328}
      .s{font-size:13px;fill:#57606a}
      .c{white-space:pre;font-size:13px;fill:#1f2328;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .l{font-size:12px;fill:#57606a}
      .ln{stroke:#57606a;stroke-width:1.8;fill:none}
    </style>
  </defs>
  <rect width="1000" height="400" rx="14" fill="#fbfbfc"/>
  <text x="28" y="44" class="h">Handing a task to another agent</text>
  <rect x="28" y="150" width="210" height="110" rx="10" fill="#eef4ff" stroke="#9db7f5"/>
  <text x="46" y="182" class="b">You say</text>
  <text x="46" y="208" class="s">"Ask Claude to fix</text>
  <text x="46" y="228" class="s">the failing test."</text>
  <line x1="238" y1="205" x2="268" y2="205" class="ln" marker-end="url(#arr)"/>
  <rect x="270" y="150" width="210" height="110" rx="10" fill="#f4efff" stroke="#b49cf0"/>
  <text x="288" y="182" class="b">The model calls</text>
  <text x="288" y="208" class="c">delegate_task</text>
  <line x1="480" y1="205" x2="510" y2="205" class="ln" marker-end="url(#arr)"/>
  <rect x="512" y="150" width="210" height="110" rx="10" fill="#fff6e8" stroke="#f0b35a"/>
  <text x="530" y="182" class="b">The daemon</text>
  <text x="530" y="208" class="s">Starts the agent in</text>
  <text x="530" y="228" class="s">the background.</text>
  <line x1="722" y1="205" x2="752" y2="205" class="ln" marker-end="url(#arr)"/>
  <text x="737" y="194" class="l" text-anchor="middle">ACP</text>
  <rect x="754" y="150" width="218" height="110" rx="10" fill="#ecf8ef" stroke="#7cc58e"/>
  <text x="772" y="182" class="b">The agent</text>
  <text x="772" y="208" class="s">Pi or Claude Code,</text>
  <text x="772" y="228" class="s">in your project folder.</text>
  <path d="M863 260 C 863 330, 617 330, 617 266" class="ln" marker-end="url(#arr)"/>
  <text x="740" y="346" class="l" text-anchor="middle">progress and the changed files come back</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
