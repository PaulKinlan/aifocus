<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="title">An extension is JSON the daemon acts on</title>
  <desc id="desc">An extension is a JSON description of a request, such as a Brave Search call. You approve it before it loads. When the model calls it, the daemon makes the request to the allowed host and adds the API key itself, so the key never reaches the page or the model.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
    <style>
      .h{font-size:16px;font-weight:650;fill:#1f2328}
      .b{font-size:15px;font-weight:600;fill:#1f2328}
      .s{font-size:13px;fill:#57606a}
      .c{font-size:13px;fill:#1f2328;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .ln{stroke:#57606a;stroke-width:1.8;fill:none}
    </style>
  </defs>
  <rect width="1000" height="400" rx="14" fill="#fbfbfc"/>
  <text x="28" y="44" class="h">An extension is data, and the daemon does the work</text>

  <rect x="28" y="80" width="280" height="110" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="46" y="112" class="b">A JSON description</text>
  <text x="46" y="138" class="s">"GET api.search.brave.com,</text>
  <text x="46" y="158" class="s">at most 20 times a session"</text>

  <line x1="308" y1="135" x2="358" y2="135" class="ln" marker-end="url(#arr)"/>

  <rect x="360" y="80" width="280" height="110" rx="10" fill="#eef4ff" stroke="#9db7f5"/>
  <text x="378" y="112" class="b">You approve it</text>
  <text x="378" y="138" class="s">Nothing loads until you do,</text>
  <text x="378" y="158" class="s">even if the model proposed it.</text>

  <rect x="28" y="250" width="280" height="110" rx="10" fill="#f4efff" stroke="#b49cf0"/>
  <text x="46" y="282" class="b">The model calls it</text>
  <text x="46" y="310" class="c">call_extension("brave_search")</text>

  <line x1="308" y1="305" x2="358" y2="305" class="ln" marker-end="url(#arr)"/>

  <rect x="360" y="250" width="280" height="110" rx="10" fill="#fff6e8" stroke="#f0b35a"/>
  <text x="378" y="282" class="b">The daemon makes the call</text>
  <text x="378" y="308" class="s">Only to the allowed host, and it</text>
  <text x="378" y="328" class="s">adds $BRAVE_API_KEY itself.</text>

  <line x1="640" y1="305" x2="690" y2="305" class="ln" marker-end="url(#arr)"/>

  <rect x="692" y="250" width="280" height="110" rx="10" fill="#ecf8ef" stroke="#7cc58e"/>
  <text x="710" y="282" class="b">Results come back</text>
  <text x="710" y="308" class="s">The key never reaches the</text>
  <text x="710" y="328" class="s">page or the model.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
