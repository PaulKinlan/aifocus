<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 1000 400" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="title">Running a command by voice</title>
  <desc id="desc">The model calls run_command. The daemon checks the session is really yours and the project is a folder on disk, then runs the command in that folder with a 20 second limit. It is not sandboxed; it runs as you.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
    <style>
      .h{font-size:16px;font-weight:650;fill:#1f2328}
      .b{font-size:15px;font-weight:600;fill:#1f2328}
      .s{font-size:13px;fill:#57606a}
      .c{white-space:pre;font-size:13px;fill:#1f2328;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .l{font-size:12px;fill:#57606a}
      .ln{stroke:#57606a;stroke-width:1.8;fill:none}
    </style>
  </defs>
  <rect width="1000" height="400" rx="14" fill="#fbfbfc"/>
  <text x="28" y="44" class="h">Running a command by voice</text>
  <rect x="28" y="130" width="260" height="110" rx="10" fill="#f4efff" stroke="#b49cf0"/>
  <text x="46" y="162" class="b">The model calls</text>
  <text x="46" y="188" class="c">run_command("npm test")</text>
  <line x1="288" y1="185" x2="358" y2="185" class="ln" marker-end="url(#arr)"/>
  <rect x="360" y="130" width="280" height="110" rx="10" fill="#fff6e8" stroke="#f0b35a"/>
  <text x="378" y="162" class="b">The daemon checks</text>
  <text x="378" y="188" class="s">Is this really your session?</text>
  <text x="378" y="208" class="s">Is the project a folder on disk?</text>
  <line x1="640" y1="185" x2="710" y2="185" class="ln" marker-end="url(#arr)"/>
  <rect x="712" y="130" width="260" height="110" rx="10" fill="#ecf8ef" stroke="#7cc58e"/>
  <text x="730" y="162" class="b">It runs</text>
  <text x="730" y="188" class="s">In the project folder,</text>
  <text x="730" y="208" class="s">stopped after 20 seconds.</text>
  <rect x="360" y="280" width="280" height="80" rx="10" fill="#fff0f0" stroke="#e58b8b"/>
  <text x="378" y="312" class="b">Not a sandbox</text>
  <text x="378" y="338" class="s">It runs as you.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
