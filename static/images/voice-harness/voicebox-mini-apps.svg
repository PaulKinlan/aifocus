<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 1000 400" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="title">A mini-app is made by the model and used by the model</title>
  <desc id="desc">The model writes an HTML page. It runs in a sandboxed iframe with no network unless you allow it. The app registers tools with WebMCP, and the model can then call those tools by voice.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
    <style>
      .h{font-size:16px;font-weight:650;fill:#1f2328}
      .b{font-size:15px;font-weight:600;fill:#1f2328}
      .s{font-size:13px;fill:#57606a}
      .c{white-space:pre;font-size:13px;fill:#1f2328;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .ln{stroke:#57606a;stroke-width:1.8;fill:none}
    </style>
  </defs>
  <rect width="1000" height="400" rx="14" fill="#fbfbfc"/>
  <text x="28" y="44" class="h">The model builds an app, then uses it</text>

  <rect x="28" y="150" width="220" height="110" rx="10" fill="#f4efff" stroke="#b49cf0"/>
  <text x="46" y="182" class="b">The model</text>
  <text x="46" y="208" class="s">Writes the HTML,</text>
  <text x="46" y="228" class="s">then calls its tools.</text>

  <path d="M248 180 C 316 180, 316 130, 382 130" class="ln" marker-end="url(#arr)"/>
  <text x="316" y="116" class="c" text-anchor="middle" font-size="12">launch_mini_app</text>

  <rect x="384" y="72" width="588" height="270" rx="12" fill="#fff0f0" stroke="#e58b8b"/>
  <text x="404" y="102" class="b">Sandboxed iframe</text>
  <text x="404" y="126" class="s">No access to the page or the daemon.</text>
  <text x="404" y="146" class="s">No network unless you allow it.</text>
  <rect x="404" y="170" width="548" height="150" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="424" y="200" class="b">The app</text>
  <text x="424" y="230" class="c">document.modelContext.registerTool({</text>
  <text x="424" y="250" class="c">  name: "add",</text>
  <text x="424" y="270" class="c">  execute: ({ a, b }) =&gt; a + b</text>
  <text x="424" y="290" class="c">})</text>

  <path d="M384 280 C 316 280, 316 230, 250 230" class="ln" marker-end="url(#arr)"/>
  <text x="316" y="304" class="c" text-anchor="middle" font-size="12">WebMCP tools</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
