<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 1000 400" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="title">Voicebox in one picture</title>
  <desc id="desc">The browser page talks to a local daemon over a WebSocket. The daemon holds the API keys, connects to Gemini Live, and runs tool calls against folders, commands and other agents on the machine.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
    <style>
      .h{font-size:16px;font-weight:650;fill:#1f2328}
      .b{font-size:15px;font-weight:600;fill:#1f2328}
      .s{font-size:13px;fill:#57606a}
      .c{white-space:pre;font-size:13px;fill:#1f2328;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .l{font-size:12px;fill:#57606a}
      .ln{stroke:#57606a;stroke-width:1.8;fill:none}
    </style>
  </defs>
  <rect width="1000" height="400" rx="14" fill="#fbfbfc"/>
  <text x="28" y="44" class="h">The page, a local daemon, and the live model</text>
  <rect x="28" y="150" width="250" height="110" rx="10" fill="#eef4ff" stroke="#9db7f5"/>
  <text x="46" y="182" class="b">Your browser</text>
  <text x="46" y="208" class="s">The page you talk to.</text>
  <text x="46" y="228" class="s">Files, mini-apps, tasks.</text>
  <line x1="278" y1="205" x2="368" y2="205" class="ln" marker-end="url(#arr)"/>
  <text x="323" y="195" class="l" text-anchor="middle">WebSocket</text>
  <rect x="370" y="130" width="260" height="150" rx="10" fill="#fff6e8" stroke="#f0b35a"/>
  <text x="388" y="162" class="b">Local daemon</text>
  <text x="388" y="188" class="s">Holds the API keys.</text>
  <text x="388" y="208" class="s">Runs every tool call</text>
  <text x="388" y="228" class="s">the model makes.</text>
  <line x1="630" y1="175" x2="690" y2="120" class="ln" marker-end="url(#arr)"/>
  <line x1="630" y1="235" x2="690" y2="290" class="ln" marker-end="url(#arr)"/>
  <rect x="692" y="70" width="280" height="100" rx="10" fill="#f4efff" stroke="#b49cf0"/>
  <text x="710" y="102" class="b">Gemini Live</text>
  <text x="710" y="128" class="s">Voice in, voice out, tool calls.</text>
  <rect x="692" y="240" width="280" height="100" rx="10" fill="#ecf8ef" stroke="#7cc58e"/>
  <text x="710" y="272" class="b">Your machine</text>
  <text x="710" y="298" class="s">Folders, commands and</text>
  <text x="710" y="318" class="s">other agents.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
