<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="title">Who writes the file depends on where the project lives</title>
  <desc id="desc">The voice asks to write a file. The daemon checks where the project lives. If it is a folder on disk, the daemon writes it. If it is in the browser's private storage or a folder picked in the browser, the daemon sends the write back to the page and the page writes it.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
    <style>
      .h{font-size:16px;font-weight:650;fill:#1f2328}
      .b{font-size:15px;font-weight:600;fill:#1f2328}
      .s{font-size:13px;fill:#57606a}
      .c{font-size:13px;fill:#1f2328;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .ln{stroke:#57606a;stroke-width:1.8;fill:none}
    </style>
  </defs>
  <rect width="1000" height="400" rx="14" fill="#fbfbfc"/>
  <text x="28" y="44" class="h">One file tool, two places it can land</text>

  <rect x="28" y="160" width="240" height="96" rx="10" fill="#f4efff" stroke="#b49cf0"/>
  <text x="46" y="192" class="b">The voice asks</text>
  <text x="46" y="220" class="c">write_file("notes.md")</text>

  <line x1="268" y1="208" x2="338" y2="208" class="ln" marker-end="url(#arr)"/>

  <rect x="340" y="150" width="250" height="116" rx="10" fill="#fff6e8" stroke="#f0b35a"/>
  <text x="358" y="182" class="b">The daemon's router</text>
  <text x="358" y="208" class="s">Where does this</text>
  <text x="358" y="226" class="s">project live?</text>

  <path d="M590 190 C 630 190, 630 120, 668 120" class="ln" marker-end="url(#arr)"/>
  <path d="M590 226 C 630 226, 630 296, 668 296" class="ln" marker-end="url(#arr)"/>

  <rect x="670" y="72" width="302" height="96" rx="10" fill="#ecf8ef" stroke="#7cc58e"/>
  <text x="688" y="104" class="b">A folder on disk</text>
  <text x="688" y="130" class="s">The daemon writes it.</text>
  <text x="688" y="150" class="s">Agents and commands work here too.</text>

  <rect x="670" y="248" width="302" height="96" rx="10" fill="#eef4ff" stroke="#9db7f5"/>
  <text x="688" y="280" class="b">In the browser</text>
  <text x="688" y="306" class="s">OPFS or a folder you picked: the</text>
  <text x="688" y="326" class="s">write goes back to the page to do.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
