# tools/check.conf — the tracked gate configuration for aifocus (a Hugo site).
#
# *** THIS FILE IS NOT READ BY THE DEPLOYED GATE BY ITSELF. ***
# ~/fleet/bin/fleet-check sources ONLY $HOME/.fleet/check.conf, then falls back to auto-detection
# (deno.json .tasks.check, else "npm run build && npm test" when package.json declares .scripts.test).
# Without this file installed, that auto-detection found agents-factory's machine-global config on this
# VM and the full gate ran `python3 -m unittest discover -s tests` in a Hugo repo — a gate that fails for
# a reason that has nothing to do with the change. The commands below reach the gate only after:
#     bash tools/check-cmd.sh --install
# Being tracked makes this file REVIEWABLE and DURABLE; it does not make it authoritative.
#
# WHY: The gate is tools/gate.sh, four mechanical signals:
#   1. the site still compiles (`hugo --minify` fails on broken frontmatter, template errors and bad shortcodes);
#   2. no oversized asset was added (tools/asset-size-check.sh: static/ is published byte-for-byte, so a big
#      file there is paid for by every clone, deploy and reader);
#   3. automated unit tests pass (`node --test tests/*.test.mjs`: validates markdown content negotiation,
#      traversal rejection, and content-root boundaries in functions/_middleware.js);
#   4. every internal link in the built site resolves to a generated path (tools/link-check.mjs), because a
#      link is only wrong relative to the OUTPUT: aifocus-8mx shipped a live 404 (/superapps/) through a
#      green build, green asset check and green tests, and the station that found it would have missed it
#      if the file had stayed outside its candidate set. Measured 2026-10-15: the check adds ~0.2 s
#      (57 pages, 1680 internal anchors) to a gate whose build step dominates. tests/link-check.test.mjs
#      adds ~0.7 s on top of that (11 cases; two of them spawn the CLI to assert the exit code and the
#      named failure line, which is most of it), so the gate as a whole grew from ~6.1 s to ~7 s cold.
# Without a working gate the merger cannot land anything (aifocus-c80, aifocus-8oo); without the asset ratchet
# the repo's 43 MiB of static images can grow unnoticed (aifocus-ppk).
#
# DEVIATION FROM R2 (docs/speed.md), DATED AND MEASURED 2026-10-12: the fast gate is not a strict
# subset of the full gate — both run `bash tools/gate.sh`. That is deliberate for this repo: the whole
# gate is ~2.1 s warm on this VM (build + asset check + node tests), well under 4 % of the 60 s fast
# budget and under 1 % of the 300 s full budget. Revisit if/when the test tier grows to multi-second suites
# where a subset split becomes meaningful.
#
# TIMEOUTS ARE KILL WINDOWS, not budgets: they must exceed the real run, or a bound that fires reads as
# "unknown" rather than "fail" (roles/lessons.md). Measured: 1.4 s warm / 3 s cold-ish (83 pages, 223
# tracked files). 180 s / 600 s leave room for a cold generator start and a much larger site before
# either fires.
#
# Both commands are RELATIVE and run with the working directory set to the checkout root.
# fleet-check runs `fleet-deps` (hard-linked node_modules) before the command, so `hugo-bin` on PATH via
# npm scripts is available in a fresh worktree.
CHECK_CMD='bash tools/gate.sh'
CHECK_TIMEOUT=600
CHECK_FAST_CMD='bash tools/gate.sh'
CHECK_FAST_TIMEOUT=180
