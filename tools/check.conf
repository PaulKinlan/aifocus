# tools/check.conf — the tracked gate configuration for aifocus (a Hugo site).
#
# *** THIS FILE IS NOT READ BY THE DEPLOYED GATE BY ITSELF. ***
# ~/fleet/bin/fleet-check sources ONLY $HOME/.fleet/check.conf, then falls back to auto-detection
# (deno.json .tasks.check, else "npm run build && npm test" when package.json declares .scripts.test).
# Without this file installed, that auto-detection found agents-factory's machine-global config on this
# VM and the full gate ran `python3 -m unittest discover -s tests` in a Hugo repo — a gate that fails for
# a reason that has nothing to do with the change. The commands below reach the gate only after:
#     bash tools/check-cmd.sh --install
# Being tracked makes this file REVIEWABLE and DURABLE; it does not make it authoritative.
#
# WHY: aifocus has no test suite. `hugo --minify` is the mechanical signal that the site still compiles:
# it fails on broken frontmatter, template errors and bad shortcodes, and it is the only check that
# covers all content. Without a working gate the merger cannot land anything (aifocus-c80, aifocus-8oo).
#
# DEVIATION FROM R2 (docs/speed.md), DATED AND MEASURED 2026-10-12: the fast gate is not a strict subset
# of the full gate — both run `npm run build`. That is deliberate for this repo: there is no cheaper tier
# that means anything (no unit tests, no lint config), and the whole gate is 3.1 s median on 8 vCPU,
# 5 % of the 60 s fast budget and 1 % of the 300 s full budget. R2 exists because fast-is-not-a-subset
# costs wall time; here it costs 3 s and buys the merger a working gate. Revisit when the site grows a
# real test tier (e.g. a link/asset check), which is where the subset split becomes meaningful.
#
# TIMEOUTS ARE KILL WINDOWS, not budgets: they must exceed the real run, or a bound that fires reads as
# "unknown" rather than "fail" (roles/lessons.md). Measured run: 3.1 s (cold-ish worktree, 83 pages).
# 180 s / 600 s leave room for a cold generator start and a much larger site before either fires.
#
# Both commands are RELATIVE and run with the working directory set to the checkout root.
# fleet-check runs `fleet-deps` (hard-linked node_modules) before the command, so `hugo-bin` on PATH via
# npm scripts is available in a fresh worktree.
CHECK_CMD='npm run build'
CHECK_TIMEOUT=600
CHECK_FAST_CMD='npm run build'
CHECK_FAST_TIMEOUT=180
