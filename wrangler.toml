name = "aifocus"
pages_build_output_dir = "public"
# quickAction() on the Browser Run binding needs 2026-03-24 or later. Set
# here for the first time on 2026-10-31; before this the project used the
# date chosen in the Pages dashboard.
compatibility_date = "2026-10-01"

# Workers AI binding. Used by functions/api/search.js to query the
# `aifocus-search` AI Search instance through env.AI.autorag().
[ai]
binding = "AI"

# Browser Run (formerly Browser Rendering). functions/og/[[path]].js
# screenshots each essay's og-card.html into its share image.
[browser]
binding = "BROWSER"

# Rendered share cards, keyed cards/<page path>/<card version>.png.
[[r2_buckets]]
binding = "OG_CARDS"
bucket_name = "aifocus-og"

# Reader responses (reactions, highlights, notes, comments).
# Schema: migrations/. Apply with:
#   npx wrangler d1 migrations apply aifocus-reader --remote
[[d1_databases]]
binding = "READER_DB"
database_name = "aifocus-reader"
database_id = "75475f47-2f40-4a73-b7bf-34d08ac65158"
migrations_dir = "migrations"

[vars]
# Public endpoint of the aifocus-search instance. Used server-side only, as a
# fallback when neither AI Search binding answers (functions/_lib/ai-search.js).
AI_SEARCH_PUBLIC_URL = "https://df045af1-424e-4281-ab4d-e516437dc465.search.ai.cloudflare.com"

# Cloudflare Access for /admin/* and /api/admin/* (functions/_lib/access.js
# verifies the Cf-Access-Jwt-Assertion JWT against these). Neither is secret.
ACCESS_TEAM_DOMAIN = "aifocus-team.cloudflareaccess.com"
ACCESS_AUD = "ec612dc0cd7268f2a7a54e660cf1d0308cfc64f5b3077f166c9956b3f88dbc99"

# GitHub OAuth app for reader sign-in (functions/_lib/providers/github.js).
# The client id is public; GITHUB_CLIENT_SECRET is a Pages secret.
GITHUB_CLIENT_ID = "Ov23liGZGUiFun4eOoDD"
